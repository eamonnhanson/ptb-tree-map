<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>KETSO student questions</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/automation-dashboard/" aria-label="Back to automation dashboard">
      <img src="https://www.planteenboom.nu/cdn/shop/files/plant_N_boom_logo_2000_1500_rectangle.png?v=1658947368&width=160" alt="Plant N Boom">
      <span>Automatiseringen</span>
    </a>
    <nav class="top-actions" aria-label="Dashboard navigation">
      <a class="status-pill" href="/automation-dashboard/">Dashboard</a>
      <a class="status-pill" href="/automation-dashboard/tree-sales/">Tree sales</a>
      <a class="status-pill" href="/automation-dashboard/ketso/">KETSO</a>
      <a class="status-pill" href="/automation-dashboard/follow-up/">Follow-up</a>
      <a class="status-pill" href="/automation-dashboard/workflow-maintenance/">Workflow maintenance</a>
    </nav>
  </header>

  <main>
    <section class="subpage-hero" aria-label="Student questions">
      <a class="dashboard-button" href="/automation-dashboard/follow-up/">Follow-up</a>
      <p class="eyebrow">KETSO Academy</p>
      <h1>Student questions</h1>
      <p class="intro-copy">Private tutor queue. Every answer must be checked and sent by the tutor.</p>
    </section>

    <section class="controls tutor-controls" aria-label="Question filters">
      <div class="filter-heading">
        <strong>Question filter</strong>
        <span>Filter the private tutor queue by status.</span>
      </div>
      <label>
        <span>Status</span>
        <select id="statusFilter">
          <option value="new">New</option>
          <option value="answered">Answered</option>
          <option value="closed">Closed</option>
          <option value="all">All</option>
        </select>
      </label>
      <button class="primary-action" id="load" type="button">Load questions</button>
    </section>

    <p class="operation-status" id="message" aria-live="polite">Loading questions...</p>
    <section id="questions" aria-label="Student questions"></section>
  </main>
  <script src="tutor-questions.js"></script>
</body>
</html>
