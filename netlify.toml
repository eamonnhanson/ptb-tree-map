[build]
publish = "frontend"
functions = "netlify/functions"

[functions."tree-allocated"]
included_files = ["certs/ca.pem"]

[functions."monitoring-ingest"]
included_files = ["certs/ca.pem"]

[[redirects]]
from = "/automation-dashboard"
to = "/automation-dashboard/"
status = 308
force = true

[[redirects]]
from = "/automation-dashboard/api/ketso/*"
to = "/.netlify/functions/ketso-admin/:splat"
status = 200
force = true

[[edge_functions]]
path = "/automation-dashboard"
function = "protect-automation-dashboard"

[[edge_functions]]
path = "/automation-dashboard/*"
function = "protect-automation-dashboard"
